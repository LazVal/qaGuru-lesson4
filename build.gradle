plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.14.0",
            "com.github.javafaker:javafaker:1.0.2",
            "org.junit.jupiter:junit-jupiter:5.14.2",
            "commons-io:commons-io:2.22.0", // работа с файлами
            "com.codeborne:pdf-test:1.5.0",// работа dpf
            "com.codeborne:xls-test:1.4.3",// работа excel
            "com.opencsv:opencsv:5.12.0",// работа c csv
            "org.apache.commons:commons-compress:1.28.0",// работа c rar
            "tools.jackson.core:jackson-databind:3.1.2"
    )
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}